<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - FoodApp</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body class="auth-page">


    <!-- NAVBAR -->

    <header class="navbar">

        <div class="nav-container">

            <a href="index.html"
               class="logo">
                🍔 Food<span>App</span>
            </a>

            <a href="index.html"
               class="back-home">
                ← Back to Home
            </a>

        </div>

    </header>


    <!-- LOGIN -->

    <main class="auth-container">

        <div class="auth-card">

            <div class="auth-header">

                <div class="auth-icon">
                    🍔
                </div>

                <h1>
                    Welcome Back
                </h1>

                <p>
                    Login to continue ordering delicious food.
                </p>

            </div>


            <div id="loginMessage"
                 class="message">
            </div>


            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn btn-primary btn-full"
                    id="loginButton">

                    Login

                </button>

            </form>


            <div class="auth-footer">

                <p>
                    Don't have an account?
                    <a href="register.html">
                        Create Account
                    </a>
                </p>

            </div>

        </div>

    </main>


    <script src="js/api.js"></script>
    <script src="js/app.js"></script>

</body>

</html>
