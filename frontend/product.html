<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Food Details - FoodApp</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>


<!-- ================= NAVBAR ================= -->

<header class="navbar">

    <div class="nav-container">

        <a href="index.html"
           class="logo">
            🍔 Food<span>App</span>
        </a>


        <nav class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="restaurants.html">
                Restaurants
            </a>

            <a href="cart.html">
                🛒 Cart
                <span id="cartCount"
                      class="cart-count">
                    0
                </span>
            </a>

            <a href="orders.html">
                Orders
            </a>

        </nav>


        <div class="nav-auth"
             id="navAuth">
        </div>

    </div>

</header>



<!-- ================= PRODUCT ================= -->

<main class="section">


    <div id="productContainer">

        <div class="loading">
            Loading food...
        </div>

    </div>


    <!-- ================= REVIEWS ================= -->

    <section class="reviews-section">

        <div class="section-header">

            <div>

                <span class="section-label">
                    CUSTOMER REVIEWS
                </span>

                <h2>
                    Reviews
                </h2>

            </div>

        </div>


        <!-- ADD REVIEW -->

        <div id="reviewFormContainer"
             class="review-form-container">

            <h3>
                Write a Review
            </h3>


            <form id="reviewForm">

                <div class="rating-select">

                    <label>
                        Rating
                    </label>

                    <select id="reviewRating"
                            required>

                        <option value="">
                            Select rating
                        </option>

                        <option value="5">
                            ⭐⭐⭐⭐⭐ 5
                        </option>

                        <option value="4">
                            ⭐⭐⭐⭐ 4
                        </option>

                        <option value="3">
                            ⭐⭐⭐ 3
                        </option>

                        <option value="2">
                            ⭐⭐ 2
                        </option>

                        <option value="1">
                            ⭐ 1
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <textarea
                        id="reviewText"
                        rows="4"
                        placeholder="Write your review..."
                        required>
                    </textarea>

                </div>


                <button
                    type="submit"
                    class="btn btn-primary">

                    Submit Review

                </button>

            </form>

        </div>


        <!-- REVIEWS LIST -->

        <div id="reviewsContainer">

            <div class="loading">
                Loading reviews...
            </div>

        </div>

    </section>


</main>
<!-- ================= REVIEWS ================= -->

<section class="section product-reviews">

    <div class="section-heading">

        <span class="section-label">
            CUSTOMER REVIEWS
        </span>

        <h2>
            Reviews
        </h2>

    </div>


    <div id="reviewMessage"
         class="message">
    </div>


    <!-- ADD REVIEW -->

    <div
        id="reviewFormContainer"
        class="review-form-card"
    >

        <h3>
            Write a Review
        </h3>

        <form
            id="reviewForm"
            onsubmit="submitProductReview(event)"
        >

            <div class="form-group">

                <label>
                    Rating
                </label>

                <select
                    id="reviewRating"
                    required
                >

                    <option value="">
                        Select rating
                    </option>

                    <option value="5">
                        ⭐⭐⭐⭐⭐ Excellent
                    </option>

                    <option value="4">
                        ⭐⭐⭐⭐ Good
                    </option>

                    <option value="3">
                        ⭐⭐⭐ Average
                    </option>

                    <option value="2">
                        ⭐⭐ Poor
                    </option>

                    <option value="1">
                        ⭐ Very Poor
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>
                    Review
                </label>

                <textarea
                    id="reviewText"
                    rows="5"
                    placeholder="Tell us about this food..."
                    required
                ></textarea>

            </div>


            <button
                type="submit"
                id="reviewButton"
                class="btn btn-primary"
            >
                Submit Review
            </button>

        </form>

    </div>


    <!-- REVIEW LIST -->

    <div
        id="reviewsContainer"
        class="reviews-container"
    >

        <div class="loading">
            Loading reviews...
        </div>

    </div>

</section>



<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/product.js"></script>
<script src="js/reviews.js"></script>

</body>

</html>
