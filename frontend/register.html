<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Account - FoodApp</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>


<body class="auth-page">


    <!-- NAVBAR -->

    <header class="navbar">

        <div class="nav-container">

            <a href="index.html"
               class="logo">
                🍔 Food<span>App</span>
            </a>

            <a href="index.html"
               class="back-home">
                ← Back to Home
            </a>

        </div>

    </header>


    <!-- REGISTER -->

    <main class="auth-container">

        <div class="auth-card register-card">

            <div class="auth-header">

                <div class="auth-icon">
                    🍔
                </div>

                <h1>
                    Create Account
                </h1>

                <p>
                    Join FoodApp and start ordering.
                </p>

            </div>


            <div id="registerMessage"
                 class="message">
            </div>


            <form id="registerForm">


                <!-- USERNAME -->

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Enter your username"
                        required
                    >

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="registerEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="registerEmail"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="registerPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="registerPassword"
                        placeholder="Create a password"
                        minlength="6"
                        required
                    >

                </div>


                <!-- CONTACT -->

                <div class="form-group">

                    <label for="contact">
                        Contact Number
                    </label>

                    <input
                        type="tel"
                        id="contact"
                        placeholder="Enter contact number"
                        pattern="[0-9]{10}"
                        required
                    >

                </div>


                <!-- ADDRESS -->

                <div class="form-group">

                    <label for="address">
                        Address
                    </label>

                    <textarea
                        id="address"
                        placeholder="Enter your delivery address"
                        rows="3"
                        required>
                    </textarea>

                </div>


                <button
                    type="submit"
                    class="btn btn-primary btn-full"
                    id="registerButton">

                    Create Account

                </button>


            </form>


            <div class="auth-footer">

                <p>
                    Already have an account?
                    <a href="login.html">
                        Login
                    </a>
                </p>

            </div>

        </div>

    </main>


    <script src="js/api.js"></script>
    <script src="js/app.js"></script>

</body>

</html>
